name: Vocal synthesis checks
on:
  push:
    branches: [main]
    paths: ['modules/vocal_synthesis/**', '.github/workflows/vocal-synthesis.yml']
  pull_request:
    paths: ['modules/vocal_synthesis/**', '.github/workflows/vocal-synthesis.yml']
permissions:
  contents: read
jobs:
  synthetic-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: modules/vocal_synthesis/requirements.txt
      - name: Install pinned signal-processing dependencies
        run: python -m pip install -r modules/vocal_synthesis/requirements.txt
      - name: Test score, alignment and actual WORLD output
        working-directory: modules/vocal_synthesis
        run: python -m unittest discover -s tests -v
      - name: Run isolated synthetic example
        working-directory: modules/vocal_synthesis
        run: python -m vocal_workflow demo outputs/ci-demo
